<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 500" role="img" aria-label="Prolate spheroidal half-coated Janus particle in a viscoelastic fluid">
  <defs>
    <linearGradient id="inert-fill-sp" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#ececea"/>
      <stop offset="1" stop-color="#c9c9c5"/>
    </linearGradient>
    <linearGradient id="active-fill-sp" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#c5c5c0"/>
      <stop offset="0.58" stop-color="#9d9d98"/>
      <stop offset="1" stop-color="#777772"/>
    </linearGradient>
    <radialGradient id="surface-highlight-sp" cx="0.33" cy="0.20" r="0.72">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-shadow-sp" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#000" flood-opacity="0.16"/>
    </filter>
    <clipPath id="body-clip-sp">
      <ellipse cx="240" cy="245" rx="78" ry="158"/>
    </clipPath>
    <marker id="arrow-red-sp" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9b0000"/>
    </marker>
  </defs>

  <g font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">

    <!-- polymer chains (viscoelastic environment) -->
    <g stroke="#6f9468" stroke-width="2" fill="none" opacity="0.7">
      <path transform="translate(300,118) rotate(-25)" d="M0 0 c6 -7 12 7 18 0 s12 7 18 0 s12 7 16 1"/>
      <path transform="translate(356,180) rotate(35)" d="M0 0 c6 -7 12 7 18 0 s12 7 18 0 s12 7 16 1"/>
      <path transform="translate(372,256) rotate(85)" d="M0 0 c6 -7 12 7 18 0 s12 7 18 0 s12 7 16 1"/>
      <path transform="translate(352,330) rotate(150)" d="M0 0 c6 -7 12 7 18 0 s12 7 18 0 s12 7 16 1"/>
      <path transform="translate(300,388) rotate(165)" d="M0 0 c6 -7 12 7 18 0 s12 7 18 0 s12 7 16 1"/>
      <path transform="translate(152,392) rotate(200)" d="M0 0 c6 -7 12 7 18 0 s12 7 18 0 s12 7 16 1"/>
      <path transform="translate(100,330) rotate(215)" d="M0 0 c6 -7 12 7 18 0 s12 7 18 0 s12 7 16 1"/>
      <path transform="translate(82,256) rotate(262)" d="M0 0 c6 -7 12 7 18 0 s12 7 18 0 s12 7 16 1"/>
      <path transform="translate(102,180) rotate(295)" d="M0 0 c6 -7 12 7 18 0 s12 7 18 0 s12 7 16 1"/>
      <path transform="translate(150,118) rotate(325)" d="M0 0 c6 -7 12 7 18 0 s12 7 18 0 s12 7 16 1"/>
      <path transform="translate(238,430) rotate(178)" d="M0 0 c6 -7 12 7 18 0 s12 7 18 0 s12 7 16 1"/>
      <path transform="translate(232,72) rotate(8)" d="M0 0 c6 -7 12 7 18 0 s12 7 18 0 s12 7 16 1"/>
    </g>

    <!-- solute (denser near the active pole / wake below) -->
    <g fill="#cf7d33">
      <g opacity="0.55">
        <circle cx="312" cy="150" r="2.4"/><circle cx="338" cy="186" r="2.2"/>
        <circle cx="142" cy="158" r="2.4"/><circle cx="116" cy="192" r="2.2"/>
        <circle cx="240" cy="100" r="2.2"/><circle cx="280" cy="120" r="2.4"/>
        <circle cx="350" cy="226" r="2.2"/><circle cx="98" cy="248" r="2.2"/>
      </g>
      <g opacity="0.85">
        <circle cx="338" cy="300" r="2.6"/><circle cx="330" cy="334" r="2.6"/>
        <circle cx="312" cy="364" r="2.8"/><circle cx="288" cy="388" r="2.6"/>
        <circle cx="262" cy="404" r="2.8"/><circle cx="236" cy="412" r="3"/>
        <circle cx="210" cy="406" r="2.8"/><circle cx="184" cy="392" r="2.6"/>
        <circle cx="160" cy="368" r="2.8"/><circle cx="142" cy="338" r="2.6"/>
        <circle cx="128" cy="306" r="2.4"/><circle cx="150" cy="300" r="2.4"/>
        <circle cx="172" cy="360" r="2.6"/><circle cx="200" cy="386" r="2.6"/>
        <circle cx="228" cy="398" r="2.8"/><circle cx="256" cy="388" r="2.6"/>
        <circle cx="284" cy="360" r="2.6"/><circle cx="308" cy="330" r="2.4"/>
        <circle cx="210" cy="372" r="2.4"/><circle cx="248" cy="378" r="2.6"/>
        <circle cx="276" cy="338" r="2.4"/>
      </g>
      <g opacity="0.7">
        <circle cx="238" cy="442" r="2.6"/><circle cx="220" cy="462" r="2.4"/>
        <circle cx="258" cy="462" r="2.4"/><circle cx="210" cy="448" r="2.2"/>
        <circle cx="270" cy="448" r="2.2"/>
      </g>
    </g>

    <!-- particle body (prolate spheroid) -->
    <g filter="url(#soft-shadow-sp)">
      <ellipse cx="240" cy="245" rx="78" ry="158" fill="url(#inert-fill-sp)" stroke="#2f2f2f" stroke-width="3"/>
      <path d="M162 245 C190 263 290 263 318 245 L318 403 L162 403 Z" fill="url(#active-fill-sp)" clip-path="url(#body-clip-sp)"/>
      <ellipse cx="240" cy="245" rx="78" ry="158" fill="url(#surface-highlight-sp)" clip-path="url(#body-clip-sp)"/>
      <path d="M162 245 C190 227 290 227 318 245" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="7 7" opacity="0.55"/>
      <path d="M162 245 C190 263 290 263 318 245" fill="none" stroke="#222" stroke-width="2.6"/>
      <ellipse cx="240" cy="245" rx="78" ry="158" fill="none" stroke="#2f2f2f" stroke-width="3"/>
    </g>

    <!-- propulsion direction -->
    <line x1="240" y1="80" x2="240" y2="20" stroke="#9b0000" stroke-width="3" marker-end="url(#arrow-red-sp)"/>
    <text x="252" y="42" fill="#9b0000" font-size="26" font-style="italic">U</text>

    <!-- region labels -->
    <text x="202" y="175" fill="#555" font-size="22">inert</text>
    <text x="198" y="320" fill="#f7f7f5" font-size="22">active</text>

  </g>
</svg>
