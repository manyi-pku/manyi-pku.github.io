<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" role="img" aria-label="Prolate spheroidal Janus particle with inert and active regions">
  <defs>
    <linearGradient id="inert-fill" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#ececea"/>
      <stop offset="1" stop-color="#c9c9c5"/>
    </linearGradient>
    <linearGradient id="active-fill" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#c5c5c0"/>
      <stop offset="0.58" stop-color="#9d9d98"/>
      <stop offset="1" stop-color="#777772"/>
    </linearGradient>
    <radialGradient id="surface-highlight" cx="0.33" cy="0.22" r="0.72">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#000" flood-opacity="0.16"/>
    </filter>
    <clipPath id="body-clip">
      <ellipse cx="210" cy="260" rx="92" ry="190"/>
    </clipPath>
    <marker id="arrow-dark" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#444"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9b0000"/>
    </marker>
  </defs>

  <rect width="420" height="520" fill="none"/>

  <g font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
    <line x1="210" y1="486" x2="210" y2="38" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow-dark)"/>
    <text x="225" y="48" fill="#444" font-size="24" font-style="italic">z</text>

    <line x1="148" y1="96" x2="148" y2="48" stroke="#9b0000" stroke-width="3" marker-end="url(#arrow-red)"/>
    <text x="121" y="61" fill="#9b0000" font-size="26" font-style="italic">U</text>

    <g filter="url(#soft-shadow)">
      <ellipse cx="210" cy="260" rx="92" ry="190" fill="url(#inert-fill)" stroke="#2f2f2f" stroke-width="3"/>
      <path d="M120 300 C148 318 272 318 300 300 L300 470 L120 470 Z" fill="url(#active-fill)" clip-path="url(#body-clip)"/>
      <ellipse cx="210" cy="260" rx="92" ry="190" fill="url(#surface-highlight)" clip-path="url(#body-clip)"/>

      <path d="M120 300 C148 282 272 282 300 300" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="7 7" opacity="0.55"/>
      <path d="M120 300 C148 318 272 318 300 300" fill="none" stroke="#222" stroke-width="2.6"/>
      <ellipse cx="210" cy="260" rx="92" ry="190" fill="none" stroke="#2f2f2f" stroke-width="3"/>
    </g>

    <line x1="210" y1="260" x2="210" y2="78" stroke="#555" stroke-width="1.8"/>
    <line x1="210" y1="260" x2="300" y2="260" stroke="#555" stroke-width="1.8"/>
    <text x="224" y="174" fill="#333" font-size="24" font-style="italic">a</text>
    <text x="255" y="249" fill="#333" font-size="24" font-style="italic">b</text>

    <text x="137" y="184" fill="#555" font-size="22">inert</text>
    <text x="153" y="391" fill="#f7f7f5" font-size="22">active</text>

    <line x1="304" y1="300" x2="350" y2="300" stroke="#333" stroke-width="1.6"/>
    <text x="360" y="306" fill="#222" font-size="25">&#950;<tspan dy="6" font-size="16">0</tspan></text>

    <line x1="280" y1="400" x2="336" y2="438" stroke="#444" stroke-width="1.3"/>
    <text x="278" y="461" fill="#444" font-size="19">Janus surface</text>
    <text x="278" y="484" fill="#444" font-size="18" font-style="italic">&#964; = &#964;<tspan dy="5" font-size="12">0</tspan></text>
  </g>
</svg>
