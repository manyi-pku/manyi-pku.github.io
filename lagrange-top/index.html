  <style>
    :root {
      --ink: #1f2933;
      --muted: #66758a;
      --line: #d7dde6;
      --panel: #ffffff;
      --wash: #f5f7fb;
      --blue: #173ea5;
      --red: #e93224;
      --gold: #f1a64b;
      --green: #2f8f57;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: linear-gradient(180deg, #fff 0%, #f8fafc 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
    }
    button, input { font: inherit; }
    button {
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 13px;
      color: var(--ink);
      background: #fff;
      cursor: pointer;
    }
    button.primary { border-color: #253d77; color: #fff; background: #253d77; }
    .app { width: min(1680px, calc(100vw - 32px)); margin: 0 auto; padding: 22px 0 30px; }
    .topbar { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 16px; }
    .eyebrow { margin: 0 0 4px; color: #8d3b1f; font-size: 12px; font-weight: 740; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(28px, 4vw, 48px); line-height: 1.04; font-weight: 760; letter-spacing: 0; }
    .top-actions, .preset-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .stage {
      display: grid;
      grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr);
      min-height: 640px;
      border: 1px solid var(--line);
      background: var(--panel);
    }
    .plot-stack { display: grid; grid-template-rows: 1.15fr 1fr 1fr; gap: 14px; padding: 54px 18px 18px; }
    .plot-card { position: relative; min-height: 0; border: 1px solid #e4e9f1; background: #fff; }
    .plot-card canvas { width: 100%; height: 100%; display: block; }
    .plot-label {
      position: absolute;
      left: 12px;
      top: 8px;
      color: #334155;
      font-size: 13px;
      font-weight: 700;
      pointer-events: none;
    }
    .view-wrap { position: relative; min-height: 640px; border-left: 1px solid var(--line); overflow: hidden; }
    .view-title {
      position: absolute;
      z-index: 2;
      top: 16px;
      left: 18px;
      display: flex;
      align-items: baseline;
      gap: 12px;
      pointer-events: none;
    }
    .view-title span { font-weight: 760; }
    .view-title small { color: var(--muted); font-size: 13px; }
    #topView { width: 100%; height: 100%; display: block; }
    .workbench { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 14px; margin-top: 14px; }
    .controls, .formula-panel { border: 1px solid var(--line); background: var(--panel); }
    .controls { display: grid; gap: 12px; padding: 16px; align-content: start; }
    .control-row { display: grid; grid-template-columns: 110px 1fr 60px; gap: 10px; align-items: center; }
    .control-row label { color: #344154; font-size: 14px; font-weight: 650; }
    .control-row output { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
    input[type="range"] { width: 100%; accent-color: #244a9f; }
    .control-note { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .formula-panel { padding: 16px 18px; }
    .formula-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px 26px; }
    .formula-panel p { margin: 0 0 8px; color: #2b3442; font-size: 15px; line-height: 1.55; }
    .readout { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; padding-top: 12px; border-top: 1px solid var(--line); }
    .readout span { min-height: 30px; display: inline-flex; align-items: center; gap: 3px; border: 1px solid #e2e7ef; border-radius: 6px; padding: 4px 9px; background: var(--wash); font-size: 14px; }
    .readout b { font-variant-numeric: tabular-nums; font-weight: 720; }
    .error {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 16px;
      border: 1px solid #f1b6a7;
      border-radius: 6px;
      padding: 10px 12px;
      color: #7f1d1d;
      background: #fff1ed;
      font-size: 14px;
    }
    @media (max-width: 1080px) {
      .stage, .workbench, .formula-grid { grid-template-columns: 1fr; }
      .view-wrap { border-left: 0; border-top: 1px solid var(--line); height: 560px; }
    }
    @media (max-width: 680px) {
      .app { width: min(100vw - 18px, 1680ppx); padding-top: 12px; }
      .topbar { align-items: start; flex-direction: column; }
      .control-row { grid-template-columns: 94px 1fr 52px; }
      .plot-stack { padding-left: 10px; padding-right: 10px; }
    }
  </style>
