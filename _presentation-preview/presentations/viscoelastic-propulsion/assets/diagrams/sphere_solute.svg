<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 500" role="img" aria-label="Spherical half-coated Janus particle with a solute concentration field">
  <defs>
    <linearGradient id="inert-fill-s" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#ececea"/>
      <stop offset="1" stop-color="#c9c9c5"/>
    </linearGradient>
    <linearGradient id="active-fill-s" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#c5c5c0"/>
      <stop offset="0.58" stop-color="#9d9d98"/>
      <stop offset="1" stop-color="#777772"/>
    </linearGradient>
    <radialGradient id="surface-highlight-s" cx="0.33" cy="0.22" r="0.72">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-shadow-s" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#000" flood-opacity="0.16"/>
    </filter>
    <clipPath id="body-clip-s">
      <circle cx="240" cy="235" r="118"/>
    </clipPath>
    <marker id="arrow-red-s" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9b0000"/>
    </marker>
  </defs>

  <g font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
    <g fill="#cf7d33">
