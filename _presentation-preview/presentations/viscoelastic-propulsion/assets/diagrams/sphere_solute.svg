        <circle cx="300" cy="132" r="2.4"/><circle cx="332" cy="162" r="2.2"/>
        <circle cx="150" cy="142" r="2.4"/><circle cx="120" cy="172" r="2.2"/>
        <circle cx="210" cy="112" r="2.2"/><circle cx="270" cy="120" r="2.4"/>
        <circle cx="346" cy="200" r="2.2"/><circle cx="98" cy="232" r="2.2"/>
      </g>
      <g opacity="0.85">
        <circle cx="360" cy="278" r="2.8"/><circle cx="352" cy="312" r="2.6"/>
        <circle cx="330" cy="344" r="2.8"/><circle cx="300" cy="368" r="2.6"/>
        <circle cx="270" cy="388" r="2.8"/><circle cx="235" cy="398" r="3"/>
        <circle cx="200" cy="392" r="2.8"/><circle cx="166" cy="382" r="2.6"/>
        <circle cx="136" cy="358" r="2.8"/><circle cx="112" cy="328" r="2.6"/>
        <circle cx="92" cy="296" r="2.6"/><circle cx="88" cy="266" r="2.4"/>
        <circle cx="128" cy="300" r="2.4"/><circle cx="152" cy="348" r="2.6"/>
        <circle cx="186" cy="374" r="2.6"/><circle cx="216" cy="386" r="2.8"/>
        <circle cx="250" cy="380" r="2.6"/><circle cx="284" cy="354" r="2.6"/>
        <circle cx="312" cy="328" r="2.6"/><circle cx="334" cy="300" r="2.4"/>
        <circle cx="200" cy="358" r="2.4"/><circle cx="240" cy="366" r="2.6"/>
        <circle cx="278" cy="330" r="2.4"/>
      </g>
      <g opacity="0.7">
        <circle cx="238" cy="430" r="2.6"/><circle cx="222" cy="450" r="2.4"/>
        <circle cx="256" cy="452" r="2.4"/><circle cx="210" cy="436" r="2.2"/>
        <circle cx="270" cy="438" r="2.2"/>
      </g>
    </g>

    <g filter="url(#soft-shadow-s)">
      <circle cx="240" cy="235" r="118" fill="url(#inert-fill-s)" stroke="#2f2f2f" stroke-width="3"/>
      <path d="M122 235 C150 253 330 253 358 235 L358 355 L122 355 Z" fill="url(#active-fill-s)" clip-path="url(#body-clip-s)"/>
      <circle cx="240" cy="235" r="118" fill="url(#surface-highlight-s)" clip-path="url(#body-clip-s)"/>
      <path d="M122 235 C150 217 330 217 358 235" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="7 7" opacity="0.55"/>
      <path d="M122 235 C150 253 330 253 358 235" fill="none" stroke="#222" stroke-width="2.6"/>
      <circle cx="240" cy="235" r="118" fill="none" stroke="#2f2f2f" stroke-width="3"/>
    </g>

    <line x1="240" y1="100" x2="240" y2="36" stroke="#9b0000" stroke-width="3" marker-end="url(#arrow-red-s)"/>
    <text x="252" y="58" fill="#9b0000" font-size="26" font-style="italic">U</text>
    <text x="200" y="180" fill="#555" font-size="22">inert</text>
    <text x="196" y="306" fill="#f7f7f5" font-size="22">active</text>
